<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园新闻管理 · 横火高中</title><link rel="stylesheet" href="/static/style.css"><script src="/static/auth.js"></script><style>
.wrap{max-width:950px;margin:28px auto;padding:0 15px}.panel2{background:white;border:1px solid #e0e3e9;padding:20px;margin:16px 0}label{display:block;margin:12px 0 5px;font-weight:600}input[type=text],select,textarea{width:100%;box-sizing:border-box;border:1px solid #ccd2db;border-radius:3px;padding:10px;font:inherit}textarea{min-height:180px}button{cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.item{border-bottom:1px solid #e8e8e8;padding:14px 0}.item:last-child{border:0}.tag{font-size:12px;color:#a51c30}.muted{color:#777;font-size:12px}.hidden{display:none}.check{display:inline-flex;gap:5px;align-items:center;margin-right:15px}img.preview{max-width:180px;max-height:130px;object-fit:contain;margin-top:8px}
</style></head><body><header class="site-header"><div class="inner"><img class="emblem" src="/static/校徽.png"><div class="titles"><h1>横 火 高 级 中 学</h1><p>校园新闻 · 管理后台</p></div></div></header><main class="wrap"><p><a href="/admin">← 返回管理员后台</a>　<a href="/archive" target="_blank">查看校园新闻区</a></p><section class="panel2"><h2 id="form-heading">发布校园新闻 / 通报</h2><p class="muted">对外统一署名：横火高级中学。三个管理员权限相同。</p><form id="news-form"><label>标题</label><input id="title" type="text" maxlength="120" required placeholder="输入新闻或通报标题"><label>分类</label><select id="category"><option>校园新闻</option><option>普通公告</option><option>表彰通报</option><option>通报批评</option></select><label>摘要（可选）</label><input id="summary" type="text" maxlength="300" placeholder="首页新闻简介"><label>正文</label><textarea id="body" maxlength="15000" required placeholder="在这里写校园新闻、表彰或通报……"></textarea><label>配图（可选，压缩后最大约 500KB）</label><input type="file" id="picture" accept="image/png,image/jpeg,image/webp"><div id="picture-box"></div><div class="actions"><label class="check"><input id="pinned" type="checkbox">置顶</label><label class="check"><input id="published" type="checkbox" checked>立即公开（取消则保存为草稿）</label></div><div class="actions"><button class="btn btn-primary" type="submit" id="save">发布 / 保存</button><button class="btn" type="button" onclick="resetForm()">取消编辑 / 清空</button></div></form><p id="message" role="status"></p></section><section class="panel2"><h2>已发布内容与草稿</h2><div id="items">加载中……</div></section></main><script>
let editing=null, all=[], imageData='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts){const res=await fetch(url,{credentials:'same-origin',...opts});const json=await res.json();if(!res.ok||!json.success)throw Error(json.msg||'操作失败');return json}
async function init(){try{const u=await Auth.me();if(!u||u.role!=='admin'){location.href='/admin/login';return}await load()}catch(e){$('message').textContent=e.message}}
async function load(){const r=await api('/api/admin/school-news');all=r.data;$('items').innerHTML=all.length?all.map(n=>`<div class="item"><div class="tag">${esc(n.category)} · ${n.published?'已发布':'草稿'} ${n.pinned?'· 📌置顶':''}</div><strong>${esc(n.title)}</strong><div class="muted">${esc(n.created_at)} · 最近编辑：${esc(n.editor_username)}</div><div class="actions"><button class="btn" onclick="editItem(${n.id})">编辑</button><button class="btn" onclick="deleteItem(${n.id})">删除</button></div></div>`).join(''):'暂无新闻，写一条试试！'}
function showImage(){const b=$('picture-box');b.replaceChildren();if(imageData){const im=document.createElement('img');im.src=imageData;im.className='preview';b.append(im);const x=document.createElement('button');x.type='button';x.textContent='移除图片';x.onclick=()=>{imageData='';$('picture').value='';showImage()};b.append(x)}}
$('picture').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){alert('请选择 JPG、PNG 或 WebP 图片');return}const img=new Image();img.src=URL.createObjectURL(f);await img.decode();const c=document.createElement('canvas');const scale=Math.min(1,1100/img.width,1100/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);imageData=c.toDataURL('image/jpeg',.7);if(imageData.length>700000){alert('图片过大，请换小一点的图片');imageData=''}showImage()};
function resetForm(){editing=null;imageData='';$('news-form').reset();$('picture').value='';$('published').checked=true;$('form-heading').textContent='发布校园新闻 / 通报';$('save').textContent='发布 / 保存';$('message').textContent='';showImage()}
function editItem(id){const n=all.find(x=>x.id===id);if(!n)return;editing=id;['title','category','summary','body'].forEach(k=>$(k).value=n[k]);$('pinned').checked=!!n.pinned;$('published').checked=!!n.published;imageData=n.image_data||'';showImage();$('form-heading').textContent='编辑：'+n.title;$('save').textContent='保存修改';window.scrollTo({top:0,behavior:'smooth'})}
async function deleteItem(id){if(!confirm('确定删除这条新闻吗？删除后无法恢复。'))return;try{await api('/api/admin/school-news/'+id,{method:'DELETE'});if(editing===id)resetForm();await load()}catch(e){alert(e.message)}}
$('news-form').onsubmit=async e=>{e.preventDefault();const data={title:$('title').value,category:$('category').value,summary:$('summary').value,body:$('body').value,image_data:imageData,pinned:$('pinned').checked,published:$('published').checked};$('save').disabled=true;try{await api(editing?'/api/admin/school-news/'+editing:'/api/admin/school-news',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});resetForm();$('message').textContent='保存成功！';await load()}catch(e){$('message').textContent='保存失败：'+e.message}finally{$('save').disabled=false}};
init();</script></body></html>

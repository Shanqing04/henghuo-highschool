<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园举报公示栏 · 横火高级中学</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f8;color:#202b3c;font:15px/1.65 system-ui,-apple-system,'Microsoft YaHei',sans-serif}header{background:#a51c30;color:white;padding:22px 18px;border-bottom:5px solid #193b69}header .inner{max-width:940px;margin:auto}header h1{font-size:23px;margin:0}header small{opacity:.85}main{max-width:940px;margin:24px auto;padding:0 14px}.nav{display:flex;gap:14px;margin-bottom:20px}.nav a{color:#234e86}.panel{background:white;border:1px solid #dce2ec;padding:24px;margin-bottom:20px;border-radius:8px;box-shadow:0 2px 10px #15253b08}h2{font-size:19px;margin:0 0 16px;color:#193b69;border-left:4px solid #a51c30;padding-left:10px}label{display:block;margin:13px 0 5px;font-weight:600}input,select,textarea{width:100%;font:16px system-ui,sans-serif;padding:11px 12px;border:1px solid #c5cddd;border-radius:5px;background:white;min-width:0}textarea{resize:vertical;min-height:130px}input:focus,textarea:focus,select:focus{outline:2px solid #a5bddf}.radio{display:flex;gap:24px;flex-wrap:wrap}.radio label{font-weight:400}.radio input{width:auto}.note{font-size:13px;color:#666}.warning{padding:10px 13px;background:#fff7e8;border-left:3px solid #c58b2b;font-size:13px;margin:14px 0}button{background:#a51c30;color:#fff;border:0;border-radius:5px;padding:11px 22px;font:600 15px inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.filters select{width:auto;flex:1;max-width:220px}.item{padding:18px 0;border-top:1px solid #e2e6ef}.item h3{font-size:17px;margin:4px 0}.meta{color:#67748a;font-size:12px}.tag{background:#edf2f9;color:#1d4d81;padding:3px 8px;border-radius:4px;font-size:12px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}.del{float:right;background:#666;padding:5px 10px;font-size:12px}.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}.pager button{background:#193b69}.message{padding:10px;border-radius:5px;margin:12px 0;display:none}.message.error{display:block;background:#fff0f0;color:#a51c30}.message.ok{display:block;background:#ecf8ef;color:#246a39}@media(max-width:600px){main{margin:12px auto}.panel{padding:16px}header h1{font-size:20px}}
</style></head><body>
<header><div class="inner"><h1>横火高级中学 · 校园举报公示栏</h1><small>HENGHUO HIGH SCHOOL · CAMPUS REPORT BOARD</small></div></header>
<main><div class="nav"><a href="/archive">← 返回校园门户</a><a href="/login">登录 / 注册</a></div>
<section class="panel"><h2>我要举报</h2>
<form id="report-form"><label for="category">举报类别</label><select id="category" required><option>学生</option><option>教师</option><option>宿舍</option><option>食堂</option><option>其他</option></select>
<label for="target">举报对象</label><input id="target" maxlength="80" minlength="2" placeholder="" required>
<label for="title">举报标题</label><input id="title" maxlength="120" minlength="4" placeholder="" required>
<label for="content">举报内容</label><textarea id="content" minlength="10" maxlength="3000" placeholder="请描述具体经过。请勿公开手机号、住址等私人信息。" required></textarea>
<label>公开署名方式</label><div class="radio"><label><input type="radio" name="identity" value="anonymous" checked> 匿名（显示“匿名同学”）</label><label><input type="radio" name="identity" value="real"> 实名（显示登录账号名称）</label></div>
<div class="warning">投稿提交后将立即公开，举报内容仅代表投稿者陈述，未经校方核实。请勿公开个人隐私或发布人身攻击内容。</div>
<div id="submit-msg" class="message" role="status"></div><button id="submit-btn" type="submit">提交并公开举报</button></form></section>
<section class="panel" id="board"><h2>全校举报公示</h2><div class="filters"><label for="filter" style="margin:0">筛选类别</label><select id="filter"><option value="">全部举报</option><option>学生</option><option>教师</option><option>宿舍</option><option>食堂</option><option>其他</option></select><span id="total" class="note"></span></div><div id="feed" aria-live="polite">正在加载……</div><div class="pager"><button id="prev" type="button">上一页</button><span id="page-no">第 1 页</span><button id="next" type="button">下一页</button></div></section></main>
<script>
const $=id=>document.getElementById(id);let page=1,total=0,isAdmin=false;
function msg(text,ok=false){let el=$('submit-msg');el.textContent=text;el.className='message '+(ok?'ok':'error');}
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
async function load(){ $('feed').textContent='正在加载……';try{let q=new URLSearchParams({page:String(page),category:$('filter').value});let r=await fetch('/api/campus-reports?'+q);let j=await r.json();if(!r.ok||!j.success)throw Error(j.msg||'加载失败');total=j.total;let feed=$('feed');feed.replaceChildren();$('total').textContent='共 '+total+' 条';if(!j.data.length)feed.append(node('p','note','暂无举报记录。'));for(let d of j.data){let card=node('article','item');let tag=node('span','tag',d.category);card.append(tag);if(isAdmin){let del=node('button','del','删除');del.type='button';del.onclick=async()=>{if(!confirm('确定删除这条举报？'))return;let rr=await fetch('/api/campus-reports/'+d.id,{method:'DELETE'});let jj=await rr.json();if(jj.success)load();else alert(jj.msg||'删除失败');};card.append(del);}card.append(node('h3','',d.title));card.append(node('div','meta','举报对象：'+d.target+' · 举报人：'+d.author+' · '+d.created_at));card.append(node('div','body',d.content));feed.append(card);}$('page-no').textContent='第 '+page+' 页';$('prev').disabled=page<=1;$('next').disabled=page*30>=total;}catch(e){$('feed').textContent='读取失败：'+e.message;}}
$('report-form').addEventListener('submit',async e=>{e.preventDefault();let btn=$('submit-btn');btn.disabled=true;btn.textContent='正在提交……';$('submit-msg').className='message';try{let body={category:$('category').value,target:$('target').value.trim(),title:$('title').value.trim(),content:$('content').value.trim(),anonymous:document.querySelector('[name=identity]:checked').value==='anonymous'};let r=await fetch('/api/campus-reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok||!j.success)throw Error(j.msg||'提交失败');msg('举报已成功公开！',true);$('report-form').reset();page=1;$('filter').value='';await load();$('board').scrollIntoView({behavior:'smooth'});}catch(err){msg(err.message==='未登录'?'请先登录账号再提交举报。':err.message);}finally{btn.disabled=false;btn.textContent='提交并公开举报';}});
$('filter').onchange=()=>{page=1;load();};$('prev').onclick=()=>{if(page>1){page--;load();}};$('next').onclick=()=>{if(page*30<total){page++;load();}};
fetch('/api/auth/me').then(r=>r.json()).then(j=>{let u=j.data||j.user||j;if(u&&u.role==='admin')isAdmin=true;load();}).catch(load);
</script></body></html>

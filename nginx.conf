# ============================================================
# 横火高级中学模拟系统 · Nginx 反代配置（HTTPS + Let's Encrypt）
# ============================================================
# 使用方法（服务器上执行）：
#   1. 把本文件复制到：/etc/nginx/sites-available/hengfu
#      并把下面的 your.domain.com 替换成你真实的域名
#   2. ln -s /etc/nginx/sites-available/hengfu /etc/nginx/sites-enabled/
#   3. nginx -t && nginx -s reload
#   4. certbot --nginx -d 你的域名  （自动申请 HTTPS 证书）
# ============================================================

# --- HTTP 自动跳 HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;  # ← 替换这里

    # certbot 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# --- HTTPS 主站（certbot --nginx 会自动补全证书配置）---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your.domain.com;  # ← 替换这里

    # --- 证书路径（certbot 申请后路径如下，若自动填好请忽略）---
    # ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # --- 反代到 Flask（gunicorn 跑在 127.0.0.1:5000）---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_read_timeout  300;
        proxy_send_timeout  300;
        client_max_body_size 15M;  # 证件照上传上限
    }

    # --- 静态资源直接由 Nginx 服务（加速）---
    location /static/ {
        alias /opt/hengfu/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- 用户上传文件（证件照/档案图）---
    location /uploads/ {
        alias /opt/hengfu/uploads/;
        expires 7d;
        access_log off;
    }

    # --- 准考证生成（动态，必须走 Flask）---
    location /tickets/ {
        proxy_pass http://127.0.0.1:5000;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
